[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tutor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx==0.28.1",
    "langfuse>=4.0,<5.0",
    "openinference-instrumentation-llama-index",
    "llama-index-core",
    "neo4j==6.1.0",
    "openai==2.26.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "tenacity==9.1.4",
    "torch",
    "torchtune",
    "typer==0.24.1",
    "uvicorn[standard]",
]

[project.scripts]
ai-tutor = "ai_tutor.main:cli"
ai-tutor-api = "ai_tutor.api:serve"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
