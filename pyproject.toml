[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-tracing"
version = "0.1.0"
description = "Knowledge tracing models and training pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sohn Jun Ho" }
]
dependencies = [
  "numpy==2.4.2",
  "pandas==3.0.1",
  "torch==2.10.0",
  "torchao==0.16.0",
  "pytorch-lightning==2.6.1",
  "torchmetrics==1.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "ruff==0.15.5",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
# Linux x86_64: CUDA 12.6 wheel
# macOS (Intel or Apple Silicon) / Windows: default PyPI (CPU / MPS-enabled)
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
