[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tutor"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
ai-tutor = "ai_tutor.main:cli"
ai-tutor-api = "ai_tutor.api:serve"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]
service = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ai_tutor", "bkt_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
