[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tutor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx==0.28.1",
    "langfuse==2.60.10",
    "llama-index-core",
    "neo4j==6.1.0",
    "openai==2.26.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "tenacity==9.1.4",
    "typer==0.24.1",
    "uvicorn[standard]",
]

[project.scripts]
ai-tutor = "ai_tutor.main:cli"
ai-tutor-api = "ai_tutor.api:serve"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
