apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-service
  namespace: ai-tutor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-service
  template:
    metadata:
      labels:
        app: vllm-service
    spec:
      nodeSelector:
        nvidia.com/gpu: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm-service
          image: vllm/vllm-openai:latest
          args:
            - "--model"
            - "$(VLLM_MODEL_NAME)"
            - "--port"
            - "8080"
          ports:
            - containerPort: 8080
          env:
            - name: VLLM_MODEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: ai-tutor-config
                  key: VLLM_MODEL_NAME
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-tutor-secrets
                  key: HF_TOKEN
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 24Gi
            requests:
              memory: 16Gi
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
