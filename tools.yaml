sources:
  math-kg:
    kind: neo4j
    uri: ${NEO4J_URI}
    user: ${NEO4J_USERNAME}
    password: ${NEO4J_PASSWORD}

tools:
  get_prerequisites:
    kind: neo4j-cypher
    source: math-kg
    description: >
      For a student with LOW proficiency (하), retrieve the current concept
      and the prerequisite concepts they should study first before attempting
      this knowledge component again.
    parameters:
      - name: skill_id
        type: integer
        description: The skill_id of the KnowledgeComponent to look up.
    statement: |
      MATCH (current:KnowledgeComponent {skill_id: $skill_id})
      OPTIONAL MATCH (current)-[:REQUIRE]->(prereq:KnowledgeComponent)
      RETURN
        current.skill_id   AS skill_id,
        current.name       AS name,
        current.semester   AS semester,
        current.description AS description,
        collect({
          skill_id:    prereq.skill_id,
          name:        prereq.name,
          semester:    prereq.semester,
          description: prereq.description
        }) AS next_skills

  get_current_concept:
    kind: neo4j-cypher
    source: math-kg
    description: >
      For a student with MEDIUM proficiency (중), retrieve the current concept
      details so the LLM can recommend targeted consolidation practice.
    parameters:
      - name: skill_id
        type: integer
        description: The skill_id of the KnowledgeComponent to look up.
    statement: |
      MATCH (current:KnowledgeComponent {skill_id: $skill_id})
      RETURN
        current.skill_id    AS skill_id,
        current.name        AS name,
        current.semester    AS semester,
        current.description AS description

  get_advanced_concepts:
    kind: neo4j-cypher
    source: math-kg
    description: >
      For a student with HIGH proficiency (상), retrieve concepts that depend
      on this knowledge component as a prerequisite — i.e., the next concepts
      the student is ready to advance to.
    parameters:
      - name: skill_id
        type: integer
        description: The skill_id of the KnowledgeComponent to look up.
    statement: |
      MATCH (current:KnowledgeComponent {skill_id: $skill_id})
      OPTIONAL MATCH (advanced:KnowledgeComponent)-[:REQUIRE]->(current)
      RETURN
        current.skill_id    AS skill_id,
        current.name        AS name,
        current.semester    AS semester,
        current.description AS description,
        collect({
          skill_id:    advanced.skill_id,
          name:        advanced.name,
          semester:    advanced.semester,
          description: advanced.description
        }) AS next_skills

toolsets:
  neo4j-tools:
    - get_prerequisites
    - get_current_concept
    - get_advanced_concepts
