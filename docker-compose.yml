services:

  # --------------------------------------------------------------------------
  # BKT inference service — serves the BKTransformer model over HTTP
  # --------------------------------------------------------------------------
  bkt-service:
    build:
      context: .
      dockerfile: services/Dockerfile.bkt
    ports:
      - "8001:8001"
    env_file:
      - .env
    networks:
      - tutor-net

  # --------------------------------------------------------------------------
  # vLLM inference server — only starts with: docker compose --profile vllm up
  # Requires an NVIDIA GPU on the host machine.
  # --------------------------------------------------------------------------
  vllm-service:
    image: vllm/vllm-openai:latest
    ports:
      - "8080:8080"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    command: ["--model", "${VLLM_MODEL_NAME}", "--port", "8080"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - tutor-net
    profiles:
      - vllm

  # --------------------------------------------------------------------------
  # Orchestrator — thin FastAPI that drives the tutor workflow
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      BKT_SERVICE_URL: http://bkt-service:8001
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      LLM_BACKEND: ${LLM_BACKEND}
      LLM_MODEL: ${LLM_MODEL}
      VLLM_BASE_URL: http://vllm-service:8080/v1
    depends_on:
      - bkt-service
    networks:
      - tutor-net

networks:
  tutor-net:
    driver: bridge
