services:
  triton:
    build:
      context: .
      dockerfile: Dockerfile.triton
    volumes:
      - ./triton_server/model_repository:/models:ro
    command:
      - tritonserver
      - --model-repository=/models
    ports:
      - "8001:8001"   # gRPC
      - "8002:8002"   # metrics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    image: ${ECR_IMAGE}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TRITON_URL: triton:8001
    depends_on:
      triton:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./ops/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

volumes:
  grafana-data:
