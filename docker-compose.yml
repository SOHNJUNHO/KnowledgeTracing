services:

  # --------------------------------------------------------------------------
  # BKT inference service — serves the BKTransformer model over HTTP
  # --------------------------------------------------------------------------
  bkt-service:
    build:
      context: .
      dockerfile: Dockerfile.bkt
    ports:
      - "8001:8080"
    env_file:
      - .env
    environment:
      - GCS_CHECKPOINT_URI=${GCS_CHECKPOINT_URI}
    networks:
      - tutor-net

  # --------------------------------------------------------------------------
  # Main tutor API
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      BKT_SERVICE_URL: http://bkt-service:8080
    depends_on:
      - bkt-service
    networks:
      - tutor-net

networks:
  tutor-net:
    driver: bridge
